<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Share cards</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{--bg:#EEF1F6;--paper:#FBFCFE;--ink:#14110F;--muted:#5D6477;--line:#DCE1EA;--blue:#2B3BFF;--orange:#FF5B1F}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px,var(--bg);
    font-family:"DM Sans",system-ui,sans-serif;color:var(--ink)}
  .panel{position:absolute;left:64px;top:64px;width:640px;height:502px;padding:52px 56px;border-radius:28px;background:var(--paper);border:1px solid var(--line);box-shadow:0 40px 90px -40px rgba(20,17,15,.35);display:flex;flex-direction:column}
  .tag{font:500 18px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:14px}
  .tag i{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue)}
  h1{margin-top:34px;font:600 76px/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em}
  h1 em{font:italic 400 80px "Instrument Serif",serif;letter-spacing:-.02em;color:var(--blue)}
  .foot{margin-top:auto;font:500 17px "DM Mono",monospace;color:var(--muted);letter-spacing:.02em}
  svg.flow{position:absolute;right:30px;top:40px}
  .belt{display:flex;height:22px;border-radius:5px;overflow:hidden;width:420px;margin-top:30px;box-shadow:inset 0 0 0 1.5px rgba(20,17,15,.25)}
  .belt i{flex:1}.belt i:nth-child(5){position:relative}.belt i:nth-child(5)::after{content:"";position:absolute;right:16px;top:0;bottom:0;width:22px;background:#C8102E}
  .icon{width:180px;height:180px}
</style>
</head>
<body>
<!-- main: the flow, from the start event to the orange end -->
<div class="card" id="main">
  <div class="panel">
    <p class="tag"><i></i>Juliana de Campos Ribeiro</p>
    <h1>Jurídico não precisa ser um <em>labirinto</em>.</h1>
    <p class="foot">processo · tecnologia · IA · ensino</p>
  </div>
  <svg class="flow" width="440" height="560" viewBox="0 0 440 560" fill="none">
    <path d="M220 40 V120 H330 V250 H150 V380 H260 V500" stroke="#2B3BFF" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="220" cy="40" r="22" fill="#FBFCFE" stroke="#14110F" stroke-width="3"/>
    <rect x="290" y="150" width="80" height="54" rx="10" fill="#FBFCFE" stroke="#14110F" stroke-width="3"/>
    <rect x="110" y="270" width="80" height="54" rx="10" fill="#FBFCFE" stroke="#14110F" stroke-width="3"/>
    <rect x="150" y="355" width="40" height="40" transform="rotate(45 170 375)" fill="#FBFCFE" stroke="#14110F" stroke-width="3"/>
    <circle cx="260" cy="500" r="30" fill="#FF5B1F"/>
    <circle cx="330" cy="120" r="9" fill="#FF5B1F"/>
  </svg>
</div>

<!-- tatame: the belt is the path -->
<div class="card" id="tatame">
  <div class="panel">
    <p class="tag"><i></i>Desvio opcional · gateway</p>
    <h1>A trilha do <em>tatame</em>.</h1>
    <div class="belt"><i style="background:#F4F6F9"></i><i style="background:#2346C8"></i><i style="background:#5B2D91"></i><i style="background:#6B4224"></i><i style="background:#14110F"></i></div>
    <p class="foot">faixa preta desde 2024</p>
  </div>
  <svg class="flow" width="440" height="560" viewBox="0 0 440 560" fill="none">
    <rect x="160" y="210" width="140" height="140" rx="16" transform="rotate(45 230 280)" fill="#0B0B0B"/>
    <rect x="190" y="240" width="80" height="80" rx="10" transform="rotate(45 230 280)" stroke="#4C74F2" stroke-width="4"/>
    <rect x="208" y="258" width="44" height="44" rx="7" transform="rotate(45 230 280)" stroke="#9A6AD8" stroke-width="4"/>
    <rect x="221" y="271" width="18" height="18" rx="4" transform="rotate(45 230 280)" stroke="#E0213F" stroke-width="4"/>
  </svg>
</div>

<!-- touch icon, same mark as favicon.svg -->
<img class="icon" id="icon" src="../favicon.svg" alt="">
</body>
</html>
